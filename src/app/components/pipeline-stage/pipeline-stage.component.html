<div class="pipeline-stage">
  <div class="stage-header">
    <h3>{{ title() }}</h3>
    <span class="deal-count">{{ deals().length }} deals</span>
    <span class="stage-value">{{ getTotalDealsValue() | currency }} </span>
  </div>

  <div
    cdkDropList
    class="deals-container"
    [cdkDropListData]="deals()"
    (cdkDropListDropped)="drop($event)"
  >
    @for (deal of deals(); track deal.dealId) {
    <app-deal-item cdkDrag cdkDragData="deal" [deal]="deal" />
    }
  </div>
</div>
