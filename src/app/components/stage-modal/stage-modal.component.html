@if (show()) {
<!-- New Stage Modal -->
<div id="newStageModal" class="modal">
  <div class="modal-content">
    <span
      class="close-modal"
      onclick="document.getElementById('newStageModal').style.display='none'"
      >&times;</span
    >
    <h2>Edit Stages</h2>
    <form class="stage-form">
      <div class="form-group">
        <div class="input-row">
          <input
            type="text"
            id="stageName1"
            name="stageName1"
            placeholder="Enter stage name"
            required
          />
          <div class="input-actions">
            <button
              type="button"
              class="icon-btn add-btn"
              title="Add Stage"
              onclick="addInput()"
            >
              ➕
            </button>
            <button
              type="button"
              class="icon-btn remove-btn"
              title="Remove Stage"
              onclick="removeInput(this)"
            >
              ➖
            </button>
            <button
              type="button"
              class="icon-btn drag-btn"
              title="Reorder Stage"
            >
              ☰
            </button>
          </div>
        </div>
      </div>
      <div class="form-actions">
        <button
          type="button"
          class="cancel-btn"
          onclick="document.getElementById('newStageModal').style.display='none'"
        >
          Cancel
        </button>
        <button type="submit" class="submit-btn">Add Stage</button>
      </div>
    </form>
  </div>
</div>

}
